services:
  db:
    image: postgres:17-alpine
    container_name: daily_stack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stack
      POSTGRES_PASSWORD: stack
      POSTGRES_DB: daily_stack
    ports:
      - "55432:5432"
    volumes:
      - daily_stack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack -d daily_stack"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  daily_stack_pgdata:
